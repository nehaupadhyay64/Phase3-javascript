<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
<style>
   * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    background: white;
    padding: 20px;
    width: 100%;
    max-width: 350px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 10px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    background: #667eea;
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #5563c1;
}

.result {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
@media (max-width: 400px) {
    .container {
        margin: 10px;
    }
}

</style>
</head>
<body>
    <div class="container">
    <h1>💸 Tip Calculator</h1>

    <label>Bill Amount (₹)</label>
    <input type="number" id="bill" placeholder="Enter bill amount">

    <label>Tip Percentage (%)</label>
    <input type="number" id="tip" placeholder="e.g. 10, 15, 20">

    <label>Number of People</label>
    <input type="number" id="people" placeholder="How many people?">

    <button onclick="calculateTip()">Calculate</button>

    <div class="result">
        <p>Tip per person: ₹<span id="tipPerPerson">0</span></p>
        <p>Total per person: ₹<span id="totalPerPerson">0</span></p>
    </div>
</div>

<script src="tipcalculator.js"></script>
</body>
</html>
