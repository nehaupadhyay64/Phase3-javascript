<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
</head>
<style>
   body {
  min-height: 100vh;
  background: linear-gradient(135deg, #d9c6ff, #c6d8ff);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.todo-box {
  background-color:rgb(116, 169, 216);
  padding: 40px 50px;
  width: 100%;
  max-width: 500px;
  border-radius: 30px; 
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  color: #0f0f0f; 
  font-family: 'Arial', sans-serif;
  height: auto;
  border: 2px solid black;
  transition: 0.3s ease;
}
.todo-box:hover{
    transform: scale(1.03);
}

h2 {
  margin-bottom: 20px;
  font-size: 35px;
  text-align: center;
  color: #fff;
  margin-top: 10px;
  margin-bottom: 40px;
}
h3{
    font-size: 35px;
    text-align: center;
    color: white;
    padding: 5px;
    margin-top: 20px;
    margin-bottom: 20px;
}

.input-box {
  display: flex;
  gap: 10px;
  margin-bottom: 50px;
  align-items: center;
  margin-top: auto;
}
input {
  flex: 1;
  padding: 15px 18px;
  border-radius: 8px;
  border: none;
  font-size: 1.2em;
  outline: none;
  margin-left: 10px;
  width: 260px;
}


button {
  padding: 12px 20px;
  border: none;
  background: #7b5cff;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1.2em;
  transition:  0.3s ease;
  margin-left: 30px;
}

button:hover {
  background: #6848ff;
}

ul {
  list-style: none;
  margin-top: 20px;
  max-height: 300px;
  overflow-y: auto;
  padding-right: 10px;
}

li {
  background: #333; 
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: bac 0.3s ease;
}

li:hover {
  background: #444;
}

li span {
  cursor: pointer;
  flex: 1;
  font-size: 1.1em;
  color: #fff;
}

li.done span {
  text-decoration: line-through;
  opacity: 0.6;
}

li button {
  background: crimson;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.9em;
  transition: back 0.3s ease;
  border: none;
  color: #fff;
}

li button:hover {
  background: darkred;
}
</style>

<body>

<div class="todo-box">
    <h2>📝 My To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter your task">

    <button onclick="addTask()">Add Task</button>

    <h3>Task List</h3>

    <ul id="taskList"></ul>
</div>

<script src="to do list.js"></script>
</body>
</html>
